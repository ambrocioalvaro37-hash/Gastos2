<!doctype html><html lang="es"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#111111"/><link rel="manifest" href="manifest.json"/>
<title>Gastos & Eventos</title>
<style>
:root{
  --bg0:#070A10; --bg1:#0B1220;
  --card: rgba(255,255,255,.06); --stroke: rgba(255,255,255,.10);
  --text:#F6F7FB; --muted: rgba(255,255,255,.72);
  --accent:#1B5CFF; --accent2:#6EA8FF; --good:#2DD4BF;
  --event:#A855F7; /* Color VIOLETA para eventos */
  --radius:18px;
}

*{ box-sizing:border-box; }
html,body{ height:100%; margin:0; font-family: system-ui, -apple-system, sans-serif; color:var(--text); background: linear-gradient(180deg, var(--bg0), var(--bg1)); }

header{ padding:16px; position: sticky; top:0; z-index:10; backdrop-filter: blur(10px); background: rgba(7,10,16,.65); border-bottom:1px solid var(--stroke); }
main{ padding:16px; max-width: 1020px; margin:0 auto; padding-bottom:80px; }

.row{ display:flex; gap:12px; flex-wrap:wrap; }
.card{ border:1px solid var(--stroke); border-radius: var(--radius); padding:14px; background: linear-gradient(180deg, rgba(27,92,255,.14), rgba(0,0,0,.22)); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.card h2{ margin:0 0 10px; font-size:16px; letter-spacing:.2px; }

label{ font-size:12px; color: var(--muted); display:block; margin-bottom:6px; }
input, select, textarea{ width:100%; border-radius: 14px; border:1px solid var(--stroke); background: rgba(0,0,0,.30); color: var(--text); padding: 11px 12px; font-size:14px; outline:none; transition:.15s; }
input:focus, select:focus, textarea:focus{ border-color: rgba(27,92,255,.65); box-shadow: 0 0 0 4px rgba(27,92,255,.18); }
textarea{ min-height:72px; resize: vertical; }

button{ width:100%; border-radius: 14px; border:1px solid var(--stroke); background: rgba(0,0,0,.18); color: var(--text); padding: 10px 12px; font-weight:700; cursor:pointer; transition:.15s; }
button:active{ transform: scale(.98); }
button.primary{ background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: rgba(27,92,255,.55); box-shadow: 0 10px 24px rgba(27,92,255,.22); }
button.ghost{ background: transparent; }

.muted{ color: var(--muted); font-size:12px; }
.pill{ display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border:1px solid var(--stroke); border-radius:999px; font-size:12px; background: rgba(0,0,0,.22); }
.list{ margin:0; padding:0; list-style:none; }
.item{ padding: 10px 0; border-bottom:1px solid var(--stroke); }
.item:last-child{ border-bottom:0; }
.itemTop{ display:flex; justify-content:space-between; gap:10px; }
.actions{ display:flex; gap:8px; }
.actions button{ width:auto; padding:8px 10px; font-size:12px; border-radius: 12px; }

.tabs{ display:flex; gap:8px; padding:6px; border-radius: 999px; border:1px solid var(--stroke); background: rgba(0,0,0,.18); }
.tabs button{ width:auto; padding:8px 12px; border-radius:999px; border:1px solid transparent; background: transparent; font-weight:800; }
.tabs button.active{ background: rgba(27,92,255,.18); border-color: rgba(27,92,255,.45); box-shadow: 0 8px 18px rgba(27,92,255,.15); }

.grid2{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
hr{ border:0; border-top:1px solid var(--stroke); margin:12px 0; }
@media (max-width: 820px){ .grid2{ grid-template-columns:1fr; } }
.view{display:none; opacity:0; transform: translateY(10px); }
.view.is-visible{display:block;}
.view.animate-in{animation: fadeSlideIn .22s ease-out forwards;}
@keyframes fadeSlideIn{to{opacity:1; transform: translateY(0);}}
.stickyBar{ position: sticky; top: 86px; z-index: 6; margin: 8px 0 12px; padding: 12px; border-radius: var(--radius); border: 1px solid var(--stroke); background: rgba(0,0,0,.22); backdrop-filter: blur(12px); }
.calGridHeader{display:grid; grid-template-columns: repeat(7,1fr); gap:8px;}
.calGridDays{display:grid; grid-template-columns: repeat(7,1fr); gap:8px; margin-top:8px;}
.calDayBtn{ height:56px; border-radius: 16px; border:1px solid var(--stroke); background: rgba(0,0,0,.18); color: var(--text); padding: 8px 10px; text-align:left; }
.calDayBtn.sel{ border-color: rgba(27,92,255,.55); background: rgba(27,92,255,.16); }
.dot{ width:7px;height:7px;border-radius:50%; background: var(--good); display:inline-block; }
.dot.event{ background: var(--event); } /* Punto Violeta */
.dotRow{display:flex; align-items:center; gap:6px;}

/* SWITCH GASTO/EVENTO */
.mode-switch { display:flex; gap:10px; margin-bottom:15px; background:rgba(0,0,0,0.3); padding:5px; border-radius:16px; }
.mode-switch button { border:none; border-radius:12px; opacity:0.6; }
.mode-switch button.active { opacity:1; background: var(--card); border:1px solid var(--stroke); box-shadow:0 4px 10px rgba(0,0,0,0.3); }
.mode-switch button.active.mode-gasto { border-color: var(--accent); color: var(--accent2); }
.mode-switch button.active.mode-evento { border-color: var(--event); color: var(--event); }
</style></head><body>

<header>
  <div class="row" style="align-items:center;justify-content:space-between;">
    <div><div style="font-weight:800;font-size:18px;">Mi Agenda <span style="font-weight:400;opacity:0.6">Personal</span></div></div>
    <div class="tabs">
      <button class="ghost" id="tabAdd">Agregar</button>
      <button class="ghost" id="tabList">Historial</button>
      <button class="ghost" id="tabMonth">Mes</button>
    </div>
  </div>
</header>

<main>
  <div id="topPanels" class="grid2">
    <section class="card">
      <h2>💱 Dólar Blue</h2>
      <div class="row">
        <div class="pill">C: <span id="blueCompra">—</span></div>
        <div class="pill">V: <span id="blueVenta">—</span></div>
      </div>
      <div style="margin-top:10px;"><button id="btnRefreshRates" class="ghost" style="font-size:12px; padding:6px;">Actualizar</button></div>
    </section>
  </div>

  <section class="card" id="viewAdd" class="view is-visible" style="margin-top:12px;">
    
    <div class="mode-switch">
      <button id="btnSetGasto" class="active mode-gasto">💸 Gasto ($)</button>
      <button id="btnSetEvento" class="">📅 Evento (Vida)</button>
    </div>

    <div class="row">
      <div style="flex:1;"><label>Fecha</label><input type="date" id="date"/></div>
      <div style="flex:1; display:none;" id="fieldTime"><label>Hora</label><input type="time" id="timeInput"></div>
    </div>

    <div id="sectionGasto">
      <div class="row" style="margin-top:10px;">
        <div style="flex:1;"><label>Monto</label><input type="number" id="amount" placeholder="0.00" step="0.01"/></div>
        <div style="width:100px;"><label>Moneda</label><select id="currency"><option value="ARS">ARS</option><option value="USD">USD</option></select></div>
      </div>
      <div class="row" style="margin-top:10px;">
        <div style="flex:1;"><label>Categoría</label><input id="category" list="catList" placeholder="Ej: Comida"/><datalist id="catList"></datalist></div>
        <div style="flex:1;"><label>Método</label><select id="method"></select></div>
      </div>
      <div style="margin-top:10px;">
         <label>Cotización</label><select id="rateType"><option value="venta">Blue VENTA</option><option value="compra">Blue COMPRA</option></select>
      </div>
      <div class="pill" id="preview" style="margin-top:10px;">—</div>
    </div>

    <div id="sectionEvento" style="display:none; margin-top:10px;">
      <div class="row">
        <div style="flex:1;">
          <label>¿Qué hiciste?</label>
          <input type="text" id="eventTitle" placeholder="Ej: Saqué al perro, Kinesiólogo, Gym...">
        </div>
      </div>
      <div class="row" style="margin-top:10px;">
        <div style="flex:1;">
          <label>Etiqueta</label>
          <select id="eventType">
            <option value="Personal">🐶 Personal</option>
            <option value="Salud">🏥 Salud / Médico</option>
            <option value="Trabajo">💼 Trabajo</option>
            <option value="Social">🎉 Social</option>
            <option value="Recordatorio">⏰ Recordatorio</option>
          </select>
        </div>
      </div>
    </div>

    <div style="margin-top:10px;">
      <label>Nota extra (Opcional)</label><textarea id="note" placeholder="Detalles..."></textarea>
    </div>

    <div class="row" style="margin-top:20px;">
      <button class="primary" id="btnSave">Guardar</button>
    </div>
  </section>

  <section class="card" id="viewList" class="view" style="margin-top:12px;">
    <div class="stickyBar">
      <div class="row" style="justify-content:space-between;align-items:center;">
        <h2 style="margin:0;">📜 Historial</h2>
        <input type="month" id="filterMonth" style="width:auto; padding:6px;">
      </div>
      <input id="filterText" placeholder="Buscar..." style="margin-top:8px;">
    </div>
    <ul class="list" id="list"></ul>
    <div class="muted" id="listEmpty" style="display:none; text-align:center; padding:20px;">Nada por aquí.</div>
  </section>

  <section class="card" id="viewMonth" class="view" style="margin-top:12px;">
    <div class="stickyBar">
      <div class="row" style="justify-content:space-between;align-items:center;">
        <h2 style="margin:0;">📊 Mes</h2>
        <div class="row" style="gap:5px;">
           <button class="ghost" id="calPrev" style="width:auto;">◀</button>
           <button class="ghost" id="calNext" style="width:auto;">▶</button>
        </div>
      </div>
      <div style="text-align:center; font-weight:bold; margin-top:5px;" id="calTitle">—</div>
    </div>

    <div class="row">
      <div class="pill">ARS: <strong id="sumARS">—</strong></div>
      <div class="pill">USD: <strong id="sumUSD">—</strong></div>
    </div>

    <div class="card" style="margin-top:12px; background:rgba(0,0,0,0.3);">
      <div id="calendarGrid"></div>
    </div>

    <div class="card" style="margin-top:12px;">
      <h2 style="margin:0;">📅 Detalles <span id="calSelected"></span></h2>
      <ul class="list" id="dayList"></ul>
    </div>
  </section>

</main>
<script src="app.js"></script></body></html>
